# The README's build steps on a fresh Ubuntu 24.04 machine, with exactly the
# host packages the README lists: proves the build works on plain Linux.
# Nothing is published; on a failure the end of the log becomes annotations
# (job logs need a login, annotations do not).
name: build

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'scripts/build/**'
      - 'device/**'
      - 'image/**'
      - 'hardware-package/**'
      - 'scripts/ci/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: kernel, U-Boot, ESP and root filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      WORK: /mnt/mi9t-build
    steps:
      - uses: actions/checkout@v7

      - name: Host packages (as listed in the README)
        run: |
          df -h / /mnt
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-aarch64-linux-gnu bc bison flex libssl-dev \
            libelf-dev git python3 debootstrap qemu-user-static binfmt-support \
            e2fsprogs dosfstools mtools openssl curl libgnutls28-dev \
            python3-setuptools python3-pyelftools swig
          sudo install -d -o "$USER" "$WORK"

      - name: scripts/build/build-kernel.sh
        run: |
          set -o pipefail
          scripts/build/build-kernel.sh 2>&1 | tee /tmp/kernel.log | grep -E '^===|BUILD_OK|error' || true
          test -f "$WORK/kernel-fix.tar.gz"

      - name: image/build-image.sh
        env:
          IMAGE_PASSWORD: ci-only-not-a-real-password
        run: |
          set -o pipefail
          sudo -E KERNEL_TGZ="$WORK/kernel-fix.tar.gz" WORK=/mnt/mi9t-image OUT=/mnt/image-out \
            image/build-image.sh 2>&1 | tee /tmp/image.log

      - name: Logs
        if: failure()
        run: |
          [ -f /tmp/image.log ] && python3 scripts/ci/annotate_tail.py /tmp/image.log build-image.sh \
            || python3 scripts/ci/annotate_tail.py /tmp/kernel.log build-kernel.sh

      - name: Check the images
        run: |
          cd /mnt/image-out && ls -l && sha256sum -c SHA256SUMS
          head -c 8 uboot.img | grep -q 'ANDROID!'
          MTOOLS_SKIP_CHECK=1 mdir -i esp.img ::/ ::/loader/entries ::/dtbs/qcom
          sudo apt-get install -y -qq android-sdk-libsparse-utils
          sudo simg2img rootfs.img /mnt/rootfs.raw
          sudo e2fsck -fn /mnt/rootfs.raw
          sudo mkdir -p /mnt/r && sudo mount -o loop,ro /mnt/rootfs.raw /mnt/r
          test -f /mnt/r/usr/sbin/gdm3
          test -L /mnt/r/lib && test -e /mnt/r/lib/ld-linux-aarch64.so.1
          ls /mnt/r/usr/lib/modules
          test ! -e /mnt/r/etc/ssh/ssh_host_ed25519_key
          sudo grep -q '^root:[!*]' /mnt/r/etc/shadow
          sudo umount /mnt/r

      - name: First boot in a VM (scripts/ci/vm-boot-test.sh)
        env:
          IMAGE_PASSWORD: ci-only-not-a-real-password
          HOSTNAME_EXPECTED: mi9t
          # these need the phone's modem, DSP and partitions
          DEVICE_UNITS: pd-mapper.service rmtfs.service tqftpserv.service mi9t-wlan-calibration.service
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm sshpass zstd
          set -o pipefail
          sudo -E scripts/ci/vm-boot-test.sh /mnt/rootfs.raw vda 2>&1 | tee /tmp/vm.log

      - name: VM log
        if: failure()
        run: |
          if [ -f /tmp/vm.log ]; then
            python3 scripts/ci/annotate_tail.py /tmp/vm.log vm-boot-test.sh
          fi
